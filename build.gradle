plugins {
    id 'application'
}

group = 'replayroom'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'replayroom.Main'
}

sourceSets {
    main {
        java.srcDirs = ['app/src/main/java']
        resources.srcDirs = ['app/src/main/resources']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    enabled = false
}

tasks.register('runDeterministicTests', JavaExec) {
    description = 'Runs deterministic replay-room test suites.'
    group = 'verification'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output.classesDirs
    mainClass = 'replayroom.AllTests'
}

tasks.named('test') {
    finalizedBy tasks.named('runDeterministicTests')
}
