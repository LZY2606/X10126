plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'replay.server.Main'
}

tasks.register('replayTests', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic replay test harness (no external deps).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'replay.TestRunner'
}

tasks.named('test') {
    dependsOn tasks.named('replayTests')
}

tasks.named('run') {
    // ensure data dir exists relative to working dir
    workingDir = rootDir
}
